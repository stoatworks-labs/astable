name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. There is no Linux job: the CMakeLists branches on APPLE and WIN32 and
# has no Linux path, and Resolume has no Linux build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # ASTABLE_BUILD_TOOLS is ON here where the release build turns it OFF:
        # attest is a large slice of the C++ and the only place the circuit's
        # behaviour is measured at all, so compiling it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DASTABLE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The circuit
        # Deterministic, and four of these need no GPU at all: the 555 model,
        # the capacitor swing, the mark/space pot and the yoke's time constant
        # are pure CPU. The three that do render need only the software
        # rasteriser the runner has.
        run: |
          ./build/attest --period
          ./build/attest --swing
          ./build/attest --markspace
          ./build/attest --yoke
          ./build/attest --defaults
          ./build/attest --names

      - name: The picture
        # Slower, because they render: dots accumulates a full beat period and
        # presets renders eight of them.
        timeout-minutes: 20
        run: |
          ./build/attest --energy
          ./build/attest --dots
          ./build/attest --presets

      - name: Controls
        # At 240x135, because the runner has no GPU and the question is only
        # whether a control changed ANY subpixel. Two at a time: graticule's
        # sweep at 320x180 with an eight-wide pool was still going at twenty
        # minutes on a three-core runner.
        timeout-minutes: 25
        run: python3 tools/sweep.py --size 240x135 --jobs 2

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem -- and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v4
        with:
          name: astable-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # The vcpkg manifest exists solely so this line has something to
        # resolve; on macOS it declares nothing at all. The triplet is static
        # GLEW against a dynamic CRT, so the plugin matches its host.
        #
        # Tools are OFF: attest is macOS-only (CGL), and the macOS job above
        # already compiles and runs it.
        #
        # The toolchain path MUST stay double-quoted. A `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing -- CMake is then
        # handed the literal string and fails with "Could not find toolchain
        # file", which reads like a broken runner image rather than a quoting
        # bug. That cost vectrix every pull request being red for a month.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DASTABLE_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: astable-windows-x86_64
          path: build/Release/*.dll
          if-no-files-found: error
