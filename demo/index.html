  <body>
    <main id="demo">
      <noscript>
        <h1>Astable</h1>
        <p>
          An FFGL source that simulates six 555 timers at the component level (a
          capacitor, two comparators and a flip-flop each) and patches them into
          the X, Y and brightness of a television's deflection yoke. Nothing
          gets drawn as a shape. The picture is wherever the beam went,
          brightest where the beam was slowest.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/astable">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/astable/">Project page and downloads</a></li>
          <li><a href="https://github.com/stoatworks-labs/astable">Source on GitHub</a></li>
        </ul>
      </noscript>
